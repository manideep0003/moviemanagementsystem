<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Management System</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a href="index.html" class="logo">Movie<span>Box</span></a>
      <div class="nav-actions">
        <span id="welcomeUser" class="welcome-user"></span>
        <button id="addMovieBtn" class="btn primary">+ Add Movie</button>
        <a href="index.html" class="nav-link">Movies</a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="small-title">MOVIE MANAGEMENT SYSTEM</p>
        <h1>My Movie Collection</h1>
        <p class="subtitle">Add, edit, search and manage your favourite movies.</p>
      </div>
      <div class="movie-count"><span id="movieCount">0</span> movies</div>
    </section>

    <section class="controls">
      <input id="searchInput" type="text" placeholder="Search movie title...">
      <select id="genreFilter">
        <option value="all">All Genres</option>
      </select>
      <select id="ratingSort">
        <option value="none">Sort by Rating</option>
        <option value="high">Rating: High to Low</option>
        <option value="low">Rating: Low to High</option>
      </select>
      <button id="favoritesBtn" class="btn secondary">★ Favorites</button>
    </section>

    <p id="message" class="message"></p>
    <section id="movieList" class="movie-grid"></section>
  </main>

  <div id="movieModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close">&times;</button>
      <h2 id="formTitle">Add Movie</h2>

      <form id="movieForm">
        <input type="hidden" id="movieId">

        <div class="form-row">
          <div>
            <label>Title</label>
            <input id="title" required>
          </div>
          <div>
            <label>Genre</label>
            <input id="genre" required>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label>Release Year</label>
            <input id="releaseYear" type="number" min="1900" max="2100" required>
          </div>
          <div>
            <label>Language</label>
            <input id="language" required>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label>Rating</label>
            <input id="rating" type="number" min="0" max="10" step="0.1" required>
          </div>
          <div>
            <label>Duration</label>
            <input id="duration" placeholder="150 min" required>
          </div>
        </div>

        <label>Poster URL</label>
        <input id="poster" placeholder="https://...">

        <label>Description</label>
        <textarea id="description" rows="4" required></textarea>

        <button class="btn primary full" type="submit">Save Movie</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/apiConfig.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    requireLogin();
  </script>
  <script src="../js/service/movieService.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById("welcomeUser").textContent =
      "Hi, " + (sessionStorage.getItem("username") || "User");

    document.getElementById("logoutBtn").addEventListener("click", logout);
  </script>
</body>
</html>
